name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The leak check runs its generic layer here (home paths, emails, IPs, tokens). The private denylist
      # never leaves the maintainer's machine, so CI does not have it.
      - name: Run every check
        run: python3 scripts/check-all.py
