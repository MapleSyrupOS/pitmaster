name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zips:
    # Releases are made in the public repository only (ADR-011 step 4); a tag in the private one builds nothing.
    if: github.repository == 'MapleSyrupOS/pitmaster'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check before building
        run: python3 scripts/check-all.py
      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME but plugin.json says $have"; exit 1; }
      - name: Build one zip per skill per platform
        run: python3 scripts/build-variants.py --zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/zips/*.skill --title "pitmaster $GITHUB_REF_NAME" --notes "$notes"
